name: Update lottery data and publish Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    env:
      LOTTO_DISABLE_OFFICIAL_FETCH: "1"
    outputs:
      has_due: ${{ steps.due.outputs.has_due }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: due
        name: Check due lottery windows
        run: node scripts/lottery-due-windows.mjs --github-output
      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || steps.due.outputs.has_due == 'true'
        with:
          python-version: "3.12"
      - run: npm install --ignore-scripts
        if: github.event_name != 'schedule' || steps.due.outputs.has_due == 'true'
      - run: python -m pip install -r scripts/requirements-probe.txt
        if: github.event_name != 'schedule' || steps.due.outputs.has_due == 'true'
      - run: python -m playwright install --with-deps chromium
        if: github.event_name != 'schedule' || steps.due.outputs.has_due == 'true'
      - name: Generate JP official probe
        if: env.LOTTO_DISABLE_OFFICIAL_FETCH != '1' && (github.event_name != 'schedule' || contains(steps.due.outputs.markets, 'JP'))
        continue-on-error: true
        timeout-minutes: 30
        run: xvfb-run -a npm run generate:jp-official
      - run: npm run generate
        if: github.event_name != 'schedule' || steps.due.outputs.has_due == 'true'
        env:
          LOTTO_DUE_WINDOW_ONLY: ${{ github.event_name == 'schedule' && '1' || '0' }}
          LOTTO_GAME_IDS: ${{ github.event_name == 'schedule' && steps.due.outputs.game_ids || '' }}
      - name: Commit generated data
        if: github.event_name != 'schedule' || steps.due.outputs.has_due == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update lottery data"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.due.outputs.has_due == 'true'
        with:
          path: public

  deploy:
    needs: update-and-build
    if: github.event_name != 'schedule' || needs.update-and-build.outputs.has_due == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
